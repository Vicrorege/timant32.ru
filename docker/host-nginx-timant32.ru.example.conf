# Host nginx for timant32.ru — TLS + calendar ICS + reverse-proxy to Docker.
# Browser in RU never talks to t.me; the container scrapes TG and serves /api/telegram/*.
#
# REQUIRED change vs old config: remove `root /opt/timant32/build` + try_files.
# Docker app must be up: docker compose up -d  (HOST_PORT=8067)

# HTTP → HTTPS (Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name timant32.ru www.timant32.ru;

    if ($host = www.timant32.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = timant32.ru) {
        return 301 https://$host$request_uri;
    }

    return 404;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name timant32.ru www.timant32.ru;

    access_log /root/log/timant32.ru.log combined;

    ssl_certificate     /etc/letsencrypt/live/timant32.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timant32.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Calendar ICS — stays on the host (your SOGo public URL)
    location /api/calendar {
        proxy_pass https://mail.timant32.su/SOGo/dav/public/USER@DOMAIN/Calendar/personal.ics;
        proxy_set_header Host mail.timant32.su;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store";
    }

    # Everything else → Docker (static + lastfm + status + TELEGRAM POST PROXY)
    # Inside the container: nginx → node:/api/telegram → fetch t.me (works on this VPS)
    location / {
        proxy_pass http://127.0.0.1:8067;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
