# Drop-in sketch for the host nginx (TLS terminator) in front of the Docker app.
# Calendar stays on the host; everything else goes to the container on :8080.
#
# Replace your current `root /opt/timant32/build` server with this pattern.
# Keep your real SOGo ICS URL in the calendar location (do not commit it).

# HTTP → HTTPS (Certbot-style)
server {
    listen 80;
    listen [::]:80;
    server_name timant32.ru www.timant32.ru;

    if ($host = www.timant32.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = timant32.ru) {
        return 301 https://$host$request_uri;
    }

    return 404;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name timant32.ru www.timant32.ru;

    access_log /root/log/timant32.ru.log combined;

    ssl_certificate     /etc/letsencrypt/live/timant32.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timant32.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Optional: force apex
    # if ($host = www.timant32.ru) {
    #     return 301 https://timant32.ru$request_uri;
    # }

    # --- only host-level upstream proxy you need ---
    # More specific than `/`, so it never hits the container.
    location /api/calendar {
        proxy_pass https://mail.timant32.su/SOGo/dav/public/USER@DOMAIN/Calendar/personal.ics;
        proxy_set_header Host mail.timant32.su;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store";
    }

    # App (Vite/nginx in Docker): static + /api/lastfm + /api/status/*
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
